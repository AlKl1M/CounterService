// Пользовательские задачи
tasks.register('hello') {
    println 'hello, world'
}

task copyResources(type: Copy) {
    from 'src/main/resources'
    into 'build/copy-resources'
    include '**/*.xml'
    exclude '**/temp/*'
    doLast {
        println "Ресурсы скопированы в build/copy-resources"
    }
}

task generateVersionFile {
    def outputFile = file("$DEFAULT_BUILD_DIR_NAME/version.txt")
    outputs.file(outputFile)

    doLast {
        outputFile.parentFile.mkdirs()
        outputFile.text = "Версия проекта: ${project.version}\nСоздано: ${new Date()}"
    }
}

task deepClean(type: Delete) {
    delete 'logs', 'tmp', 'out'
    dependsOn clean
    doLast {
        println "Глубокая очистка выполнена"
    }
}

task projectInfo {
    doLast {
        println "Имя проекта: ${project.name}"
        println "Версия: ${project.version}"
        println "Группа: ${project.group}"
        println "Корневой проект: ${rootProject.name}"
    }
}

task countCodeLines {
    def sources = fileTree('src') {
        include '**/*.java', '**/*.kt', '**/*.groovy'
    }

    doLast {
        def lines = 0
        sources.each { file ->
            file.eachLine { lines++ }
        }

        println "Всего строк кода: $lines"
    }
}

task gitStatus {
    doLast {
        def result = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'status'
            standardOutput = result
        }
        println result.toString()
    }
}

task checkStyle {
    def checkstyleFilePath = "/home/bazingos/IdeaProjects/ipr/counter/checkstyle.xml"
    def checkstyle = new File(checkstyleFilePath)

    doLast {
        if (checkstyle.exists()) {
            def report = new XmlParser().parse(checkstyle)
            def errors = report.file.error.findAll { it.@severity == 'error' }

            if (errors) {
                def errorMessage = "Найдены ошибки стиля: ${errors.size()}\n"
                errorMessage += "Детали ошибок:\n"

                errors.each { error ->
                    errorMessage += " - ${error.@line}: ${error.@message}\n"
                }

                def reportFile = new File("${buildDir}/checkstyle_report.txt")
                reportFile.text = errorMessage

                throw new GradleException(errorMessage)
            } else {
                println "Ошибок стиля не найдено."
            }
        } else {
            println "Файл отчета Checkstyle не найден: ${checkstyleFilePath}"
        }
    }
}

task generateChangelog {
    def changelogFile = new File("${buildDir}/changelog.md")
    outputs.file(changelogFile)

    doLast {
        def tags = getGitTags()
        if (tags.empty) {
            println "Нет тегов в репозитории"
            return
        }

        def changelogContent = new StringBuilder("# Changelog\n\n")
        String previousTag = null

        tags.reverse().each { tag ->
            def tagDate = getTagDate(tag)
            def range = previousTag ? "${previousTag}..${tag}" : tag
            def commits = getCommitsInRange(range)

            changelogContent.append("## ${tag} (${tagDate})\n\n")
            commits.eachLine { commit ->
                changelogContent.append("- ${commit}\n")
            }
            changelogContent.append("\n")
            previousTag = tag
        }

        def unreleasedCommits = getCommitsInRange("${previousTag}..HEAD")
        if (unreleasedCommits) {
            changelogContent.append("## Unreleased\n\n")
            unreleasedCommits.eachLine { commit ->
                changelogContent.append("- ${commit}\n")
            }
        }

        changelogFile.text = changelogContent.toString()
        println "Changelog сгенерирован: ${changelogFile.absolutePath}"
    }
}

// Вспомогательные методы
def getGitTags() {
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'tag', '--sort=-creatordate'
        standardOutput = stdout
    }
    stdout.toString().trim().split('\n') as List
}

def getTagDate(String tag) {
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'log', '-1', '--format=%ai', tag
        standardOutput = stdout
    }
    stdout.toString().trim().split(' ').first()
}

def getCommitsInRange(String range) {
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'log', range, '--pretty=format:%h - %s (%an, %ad)', '--date=short'
        standardOutput = stdout
    }
    stdout.toString().trim()
}